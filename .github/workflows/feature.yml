name: Build and Test
on: 
  push:
    branches-ignore:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: install
      run:
        npm ci --legacy-peer-deps
    - name: Build
      run: 
        npm run build
      env:
        CI: true

    - name: Testing
      run:
        npm test
      env:
        CI: true